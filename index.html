<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EC" id="meta-theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notițe">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Notițe</title>
<style>
:root{
  --bg:#FAF6EC; --ink:#2B2620; --ink-soft:#8A8172; --ink-faded:#B7AF9E;
  --card-bg:#FFFFFF; --card-border:#EFE7D6;
  --accent:#F2A93B; --accent-ink:#7A4A00;
  --footer-bg:#2B2620; --footer-text:#F4EFE3; --footer-subtle:#9C9484;
  --danger:#D9534F; --divider:#EFE7D6;
  --search-bg:#F0EAD9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17140F; --ink:#F1ECE0; --ink-soft:#9C9484; --ink-faded:#6B6455;
    --card-bg:#221E17; --card-border:#332C20;
    --accent:#F2A93B; --accent-ink:#2B1900;
    --footer-bg:#000000; --footer-text:#F4EFE3; --footer-subtle:#8A8172;
    --danger:#E5776F; --divider:#332C20;
    --search-bg:#221E17;
  }
}
:root[data-theme="dark"]{
  --bg:#17140F; --ink:#F1ECE0; --ink-soft:#9C9484; --ink-faded:#6B6455;
  --card-bg:#221E17; --card-border:#332C20;
  --accent:#F2A93B; --accent-ink:#2B1900;
  --footer-bg:#000000; --footer-text:#F4EFE3; --footer-subtle:#8A8172;
  --danger:#E5776F; --divider:#332C20;
  --search-bg:#221E17;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  height:100%; overflow:hidden; overscroll-behavior:none;
  width:100%; position:fixed; top:0; left:0; margin:0; padding:0;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
html{ scroll-padding-top:env(safe-area-inset-top,0px); }

/* ---------- Ecran listă ---------- */
#ecran-lista{
  flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden;
}
.lista-header{
  padding:14px 18px 10px;
  padding-left:calc(env(safe-area-inset-left,0px) + 18px);
  padding-right:calc(env(safe-area-inset-right,0px) + 18px);
}
.lista-titlu{ font-size:30px; font-weight:800; margin:0 0 12px; }
.cautare{
  background:var(--search-bg); border-radius:11px; padding:9px 12px;
  display:flex; align-items:center; gap:6px;
}
.cautare svg{ flex-shrink:0; opacity:.55; }
.cautare input{
  border:none; background:transparent; outline:none; font-size:16px;
  color:var(--ink); width:100%; font-family:inherit;
}
.cautare input::placeholder{ color:var(--ink-faded); }

#lista-note{
  flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:4px 18px calc(env(safe-area-inset-bottom,0px) + 90px);
  padding-left:calc(env(safe-area-inset-left,0px) + 18px);
  padding-right:calc(env(safe-area-inset-right,0px) + 18px);
}
.nota-rand{
  padding:12px 2px; border-bottom:1px solid var(--divider);
  display:flex; flex-direction:column; gap:3px; cursor:pointer;
}
.nota-rand:active{ opacity:.6; }
.nota-titlu{ font-size:17px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nota-sub{ font-size:14px; color:var(--ink-soft); display:flex; gap:6px; white-space:nowrap; overflow:hidden; align-items:center; }
.nota-data{ flex-shrink:0; }
.nota-preview{ overflow:hidden; text-overflow:ellipsis; flex:1; }
.nota-total{ flex-shrink:0; font-weight:700; font-variant-numeric:tabular-nums; }
.nota-total.pozitiv{ color:#2E8B57; }
.nota-total.negativ{ color:var(--danger); }

.gol{
  flex:1; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:8px; color:var(--ink-faded); text-align:center; padding:0 30px;
}
.gol svg{ opacity:.35; margin-bottom:4px; }
.gol b{ font-size:17px; color:var(--ink-soft); font-weight:600; }
.gol span{ font-size:14px; }

.buton-nou{
  position:fixed; right:calc(env(safe-area-inset-right,0px) + 20px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  width:58px; height:58px; border-radius:50%; border:none;
  background:var(--accent); color:var(--accent-ink);
  font-size:28px; font-weight:400; display:flex; align-items:center; justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.25); z-index:5;
}
.buton-nou:active{ transform:scale(.94); }

/* ---------- Ecran editor ---------- */
#ecran-editor{
  position:fixed; inset:0; z-index:20; background:var(--bg); color:var(--ink);
  display:none; flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
}
#ecran-editor.deschis{ display:flex; }
.editor-bara{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px;
  padding-left:calc(env(safe-area-inset-left,0px) + 14px);
  padding-right:calc(env(safe-area-inset-right,0px) + 14px);
}
.editor-bara button{
  border:none; background:transparent; color:var(--accent); font-size:17px;
  font-family:inherit; padding:6px 8px; display:flex; align-items:center; gap:3px;
}
.editor-bara button:active{ opacity:.5; }
.editor-sterge{ color:var(--danger) !important; }
.editor-data{
  text-align:center; font-size:12px; color:var(--ink-faded); padding:2px 0 6px;
}
.editor-total{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px; margin:0 14px 8px; border-radius:12px;
  background:var(--search-bg);
  padding-left:calc(env(safe-area-inset-left,0px) + 18px);
  padding-right:calc(env(safe-area-inset-right,0px) + 18px);
}
.editor-total.ascuns{ display:none; }
.editor-total .lbl{ font-size:13px; color:var(--ink-soft); }
.editor-total .val{ font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
.editor-total .val.pozitiv{ color:#2E8B57; }
.editor-total .val.negativ{ color:var(--danger); }
#editor-text{
  flex:1; min-height:0; border:none; outline:none; background:transparent; color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  font-size:17px; line-height:1.5; resize:none;
  padding:4px 18px calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:calc(env(safe-area-inset-left,0px) + 18px);
  padding-right:calc(env(safe-area-inset-right,0px) + 18px);
  -webkit-overflow-scrolling:touch;
}
#editor-text::placeholder{ color:var(--ink-faded); }

/* ---------- Confirmare ștergere ---------- */
.confirm-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:60;
  display:none; align-items:flex-end; justify-content:center;
}
.confirm-overlay.deschis{ display:flex; }
.confirm-card{
  background:var(--card-bg); width:100%; max-width:520px;
  border-radius:16px 16px 0 0; padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  box-shadow:0 -6px 24px rgba(0,0,0,.2);
}
.confirm-card p{ text-align:center; color:var(--ink-soft); font-size:13px; margin:4px 0 12px; }
.confirm-card button{
  width:100%; padding:14px; border:none; border-radius:12px; font-size:17px;
  font-family:inherit; margin-bottom:8px;
}
.confirm-sterge{ background:var(--danger); color:#fff; font-weight:600; }
.confirm-anuleaza{ background:var(--search-bg); color:var(--ink); }
</style>
</head>
<body>

<div id="ecran-lista">
  <div class="lista-header">
    <h1 class="lista-titlu">Notițe</h1>
    <div class="cautare">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="camp-cautare" placeholder="Caută">
    </div>
  </div>
  <div id="lista-note"></div>
</div>

<button class="buton-nou" id="btn-nota-noua" aria-label="Notiță nouă">＋</button>

<div id="ecran-editor">
  <div class="editor-bara">
    <button id="btn-inapoi">‹ Notițe</button>
    <button id="btn-sterge-nota" class="editor-sterge">Șterge</button>
  </div>
  <div class="editor-data" id="editor-data"></div>
  <div class="editor-total ascuns" id="editor-total">
    <span class="lbl">Total sume din notiță</span>
    <span class="val" id="editor-total-val">0,00 lei</span>
  </div>
  <textarea id="editor-text" placeholder="Ex: Ana îmi datorează 150 lei pentru 3 parfumuri..." autocapitalize="sentences"></textarea>
</div>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-card">
    <p>Notița se șterge definitiv.</p>
    <button class="confirm-sterge" id="confirm-sterge-btn">Șterge notița</button>
    <button class="confirm-anuleaza" id="confirm-anuleaza-btn">Anulează</button>
  </div>
</div>

<script>
const CHEIE = "notite_v1";
let note = [];
let notaCurentaId = null;
let debounceSalvare = null;

function incarca(){
  try{
    const raw = localStorage.getItem(CHEIE);
    note = raw ? JSON.parse(raw) : [];
  }catch(e){ note = []; }
}
function salveaza(){
  try{ localStorage.setItem(CHEIE, JSON.stringify(note)); }catch(e){}
}
function idNou(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function formatDataScurta(ts){
  const d = new Date(ts);
  const azi = new Date();
  const eAzi = d.toDateString() === azi.toDateString();
  if(eAzi) return d.toLocaleTimeString("ro-RO", {hour:"2-digit", minute:"2-digit"});
  const ieri = new Date(azi); ieri.setDate(azi.getDate()-1);
  if(d.toDateString() === ieri.toDateString()) return "Ieri";
  const diffZile = Math.floor((azi - d) / 86400000);
  if(diffZile < 6) return d.toLocaleDateString("ro-RO", {weekday:"long"});
  return d.toLocaleDateString("ro-RO", {day:"numeric", month:"short", year: d.getFullYear()!==azi.getFullYear() ? "numeric" : undefined});
}
function formatDataLunga(ts){
  const d = new Date(ts);
  return d.toLocaleDateString("ro-RO", {day:"numeric", month:"long", year:"numeric"}) + " · " +
         d.toLocaleTimeString("ro-RO", {hour:"2-digit", minute:"2-digit"});
}
function titluSiPreview(text){
  const linii = (text||"").split("\n");
  const titlu = (linii[0] || "").trim() || "Notiță nouă";
  const rest = linii.slice(1).join(" ").replace(/\s+/g," ").trim();
  return {titlu, preview: rest};
}
function formatLei(n){
  return n.toLocaleString("ro-RO", {minimumFractionDigits:2, maximumFractionDigits:2}) + " lei";
}
function calculeazaTotal(text){
  // ia fiecare sumă scrisă (ex: 150, 45.50, 30,5, -20 pentru o plată scăzută din datorie)
  // dar ignoră numerele lipite de o dată (12.05.2024) sau de o oră (14:30)
  const curatat = String(text||"")
    .replace(/\b\d{1,2}[:.]\d{2}\b/g, " ")
    .replace(/\b\d{1,2}[./]\d{1,2}[./]\d{2,4}\b/g, " ");
  const numere = curatat.match(/-?\b\d+(?:[.,]\d{1,2})?\b/g) || [];
  return numere.reduce((sum, n) => sum + parseFloat(n.replace(",", ".")), 0);
}

function randareLista(){
  const cont = document.getElementById("lista-note");
  const filtru = document.getElementById("camp-cautare").value.trim().toLowerCase();
  let filtrate = note.slice().sort((a,b)=> b.actualizat - a.actualizat);
  if(filtru){
    filtrate = filtrate.filter(n => (n.text||"").toLowerCase().includes(filtru));
  }
  if(filtrate.length === 0){
    cont.innerHTML = "";
    const gol = document.createElement("div");
    gol.className = "gol";
    gol.innerHTML = filtru
      ? `<b>Niciun rezultat</b><span>Încearcă alt cuvânt de căutare.</span>`
      : `<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
                <b>Nicio notiță</b><span>Apasă pe ＋ ca să scrii prima notiță — vânzări, datorii, orice.</span>`;
    cont.appendChild(gol);
    return;
  }
  cont.innerHTML = "";
  filtrate.forEach(n => {
    const {titlu, preview} = titluSiPreview(n.text);
    const total = calculeazaTotal(n.text);
    const rand = document.createElement("div");
    rand.className = "nota-rand";
    rand.innerHTML = `
      <div class="nota-titlu"></div>
      <div class="nota-sub">
        <span class="nota-data"></span>
        <span class="nota-preview"></span>
        ${Math.abs(total) >= 0.005 ? `<span class="nota-total ${total>=0?"pozitiv":"negativ"}"></span>` : ""}
      </div>
    `;
    rand.querySelector(".nota-titlu").textContent = titlu;
    rand.querySelector(".nota-data").textContent = formatDataScurta(n.actualizat);
    rand.querySelector(".nota-preview").textContent = preview ? ("  " + preview) : "";
    const totalEl = rand.querySelector(".nota-total");
    if(totalEl) totalEl.textContent = (total>=0?"":"−") + formatLei(Math.abs(total));
    rand.addEventListener("click", () => deschideNota(n.id));
    cont.appendChild(rand);
  });
}

function actualizeazaTotalEditor(text){
  const cont = document.getElementById("editor-total");
  const val = document.getElementById("editor-total-val");
  const total = calculeazaTotal(text);
  if(Math.abs(total) < 0.005){ cont.classList.add("ascuns"); return; }
  cont.classList.remove("ascuns");
  val.textContent = (total>=0?"":"−") + formatLei(Math.abs(total));
  val.className = "val " + (total>=0 ? "pozitiv" : "negativ");
}

function deschideNota(id){
  notaCurentaId = id;
  const n = note.find(x => x.id === id);
  const text = n ? n.text : "";
  document.getElementById("editor-text").value = text;
  document.getElementById("editor-data").textContent = n ? formatDataLunga(n.actualizat) : "";
  actualizeazaTotalEditor(text);
  document.getElementById("ecran-editor").classList.add("deschis");
  setTimeout(() => document.getElementById("editor-text").focus(), 50);
}

function notaNoua(){
  const n = { id: idNou(), text: "", actualizat: Date.now() };
  note.unshift(n);
  deschideNota(n.id);
}

function inchideEditor(){
  // curăță notițele complet goale la ieșire
  const n = note.find(x => x.id === notaCurentaId);
  if(n && !n.text.trim()){
    note = note.filter(x => x.id !== notaCurentaId);
    salveaza();
  }
  notaCurentaId = null;
  document.getElementById("ecran-editor").classList.remove("deschis");
  randareLista();
}

document.getElementById("editor-text").addEventListener("input", (e) => {
  const n = note.find(x => x.id === notaCurentaId);
  if(!n) return;
  n.text = e.target.value;
  n.actualizat = Date.now();
  document.getElementById("editor-data").textContent = formatDataLunga(n.actualizat);
  actualizeazaTotalEditor(n.text);
  clearTimeout(debounceSalvare);
  debounceSalvare = setTimeout(salveaza, 250);
});

document.getElementById("btn-nota-noua").addEventListener("click", notaNoua);
document.getElementById("btn-inapoi").addEventListener("click", inchideEditor);
document.getElementById("camp-cautare").addEventListener("input", randareLista);

document.getElementById("btn-sterge-nota").addEventListener("click", () => {
  document.getElementById("confirm-overlay").classList.add("deschis");
});
document.getElementById("confirm-anuleaza-btn").addEventListener("click", () => {
  document.getElementById("confirm-overlay").classList.remove("deschis");
});
document.getElementById("confirm-sterge-btn").addEventListener("click", () => {
  note = note.filter(x => x.id !== notaCurentaId);
  salveaza();
  document.getElementById("confirm-overlay").classList.remove("deschis");
  notaCurentaId = null;
  document.getElementById("ecran-editor").classList.remove("deschis");
  randareLista();
});

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}

incarca();
randareLista();
</script>
</body>
</html>
